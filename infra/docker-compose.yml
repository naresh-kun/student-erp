version: '3.8'

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: erp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - erp-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=/api/v1
    networks:
      - erp-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-insecure_dev_key_for_phase1_blueprint}
      - DATABASE_URL=postgres://erp_user:erp_password@postgres:5432/student_erp
      - REDIS_URL=redis://redis:6379/1
      - ALLOWED_HOSTS=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network

  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_erp
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d student_erp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

networks:
  erp-network:
    driver: bridge
