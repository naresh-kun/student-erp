version: '3.8'

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: erp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - erp-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=/api/v1
    networks:
      - erp-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${RUNTIME_DATABASE_USER:-erp_app}:${RUNTIME_DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-student_erp}
      - DB_ROLE=app
      - RUNTIME_DATABASE_USER=${RUNTIME_DATABASE_USER:-erp_app}
      - RUNTIME_DATABASE_PASSWORD=${RUNTIME_DATABASE_PASSWORD}
      - MIGRATION_DATABASE_USER=${MIGRATION_DATABASE_USER:-erp_migrator}
      - MIGRATION_DATABASE_PASSWORD=${MIGRATION_DATABASE_PASSWORD}
      - REDIS_URL=redis://redis:6379/1
      - ALLOWED_HOSTS=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network

  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-student_erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_password}
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema/00_init_roles.sh:/docker-entrypoint-initdb.d/00_init_roles.sh:ro
      - ../database/schema/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d student_erp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

networks:
  erp-network:
    driver: bridge
